<div class="table-panel glass">

    <div class="table-toolbar">
        <div class="table-title">LIVE MONITORING</div>
        <div class="table-actions">
            <input id="studentSearch" type="text" placeholder="Cari nama / kelas..."
                oninput="filterTableBySearch(this.value)">
            <span id="activeInfo" style="font-size:12px;opacity:.75;white-space:nowrap"></span>
            <button id="activeToggle" onclick="toggleShowAll()">Tampilkan semua</button>
            <button onclick="refreshStudents()">Refresh</button>
        </div>
    </div>

    <div class="tableBox">
        <table>
            <thead>
                <tr>
                    <th data-sort="name"      onclick="sortBy('name')"      style="cursor:pointer;user-select:none" title="Klik untuk mengurutkan">Nama<span class="sortArrow"></span></th>
                    <th data-sort="kelas"     onclick="sortBy('kelas')"     style="cursor:pointer;user-select:none" title="Klik untuk mengurutkan">Kelas<span class="sortArrow"></span></th>
                    <th data-sort="progress"  onclick="sortBy('progress')"  style="cursor:pointer;user-select:none" title="Klik untuk mengurutkan">Progress<span class="sortArrow"></span></th>
                    <th data-sort="violation" onclick="sortBy('violation')" style="cursor:pointer;user-select:none" title="Klik untuk mengurutkan">Violation<span class="sortArrow"></span></th>
                    <th data-sort="unlock"    onclick="sortBy('unlock')"    style="cursor:pointer;user-select:none" title="Klik untuk mengurutkan">Unlock<span class="sortArrow"></span></th>
                    <th data-sort="status"    onclick="sortBy('status')"    style="cursor:pointer;user-select:none" title="Klik untuk mengurutkan">Status<span class="sortArrow"></span></th>
                    <th data-sort="conn"      onclick="sortBy('conn')"      style="cursor:pointer;user-select:none" title="Klik untuk mengurutkan">Koneksi<span class="sortArrow"></span></th>
                </tr>
            </thead>
            <tbody id="studentsTableBody"></tbody>
        </table>
    </div>

</div>
