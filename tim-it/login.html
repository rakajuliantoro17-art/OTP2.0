<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Login Tim IT · SMANSASOO CBT LOCK</title><style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 15% 10%,#183c68 0,transparent 38%),radial-gradient(circle at 90% 90%,#39265d 0,transparent 36%),#080d18;color:#f5f7ff}.panel{width:min(100%,410px);padding:30px;border:1px solid #ffffff22;border-radius:26px;background:#ffffff0d;backdrop-filter:blur(22px);box-shadow:0 24px 70px #0008}.mark{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:#ffffff18;font-size:25px}.eyebrow{margin:22px 0 8px;color:#9db8dc;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}h1{margin:0;font-size:26px;letter-spacing:-.7px}.sub{color:#aab6ca;line-height:1.6;font-size:13px;margin:9px 0 25px}label{display:block;font-size:12px;color:#c5cee0;margin:15px 0 8px}input{width:100%;padding:15px 14px;border:1px solid #ffffff24;border-radius:13px;background:#080f1d;color:white;font-size:16px;outline:none}input:focus{border-color:#63a8ff;box-shadow:0 0 0 3px #398cff22}button{width:100%;border:0;border-radius:13px;padding:15px;margin-top:21px;background:linear-gradient(110deg,#398cff,#7864ef);color:white;font-size:14px;font-weight:800;cursor:pointer}.msg{min-height:20px;margin-top:13px;color:#ffb6b6;font-size:12px}.note{margin-top:20px;padding-top:16px;border-top:1px solid #ffffff18;color:#8f9bb0;font-size:11px;line-height:1.55}
</style></head><body><main class="panel"><div class="mark">⌘</div><div class="eyebrow">SMANSASOO · CBT LOCK 2.0</div><h1>Dashboard Tim IT</h1><p class="sub">Akses pemantauan OTP dan status sistem. Dashboard ini bersifat baca-saja.</p><form id="loginForm"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Masuk Dashboard</button><div class="msg" id="message" role="status"></div></form><div class="note">Akses pemantauan internal. PIN Pengawas hanya dapat ditampilkan apabila tersedia dalam bentuk yang dapat dibaca dari sumber data yang sudah ada.</div></main><script>
const EXPECTED= "b779627ce7a421136bc0f75b0dce7384e9a3032cd58e9319eb59b660e4829bb2";
async function digest(value){const bytes=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(value));return Array.from(new Uint8Array(bytes),b=>b.toString(16).padStart(2,"0")).join("")}
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const u=document.getElementById("username").value.trim();const p=document.getElementById("password").value;const msg=document.getElementById("message");if(u==="timit"&&await digest(p)===EXPECTED){sessionStorage.setItem("tim_it_access","1");location.href="./index.html"}else{msg.textContent="Username atau password tidak sesuai.";document.getElementById("password").value=""}});
</script></body></html>
