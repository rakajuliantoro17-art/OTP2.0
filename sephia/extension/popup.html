<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SEPHIA Bridge</title>
  <style>
    :root { color-scheme: dark; font: 14px/1.5 system-ui, sans-serif; }
    body { width: 280px; margin: 0; padding: 18px; background: #101525; color: #edf3ff; }
    h1 { margin: 0 0 8px; font-size: 16px; }
    p { color: #aab6cc; margin: 0 0 14px; }
    button { width: 100%; border: 0; border-radius: 10px; padding: 11px; background: #5269df; color: white; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 38px; margin-top: 12px; font-size: 12px; color: #aab6cc; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>SEPHIA Local Speech</h1>
  <p>Hubungkan secara manual hanya saat tab Panitia OTP 2.0 sedang terbuka.</p>
  <button id="connect" type="button">Hubungkan tab Panitia</button>
  <div id="status" role="status" aria-live="polite">Belum terhubung. SEPHIA tetap visual-only.</div>
  <script src="popup.js"></script>
</body>
</html>
