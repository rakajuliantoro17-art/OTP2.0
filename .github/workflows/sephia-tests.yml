name: SEPHIA Tests and Build

on:
  push:
    branches:
      - feature/sephia-module
      - main
    paths:
      - "sephia/**"
      - ".github/workflows/sephia-tests.yml"
  pull_request:
    paths:
      - "sephia/**"
      - ".github/workflows/sephia-tests.yml"

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run SEPHIA unit and integration tests
        working-directory: sephia
        run: npm test
      - name: Check security boundaries and local imports
        working-directory: sephia
        run: npm run check
      - name: Build browser ES module package
        working-directory: sephia
        run: npm run build
      - name: Verify staging fixture against built distribution
        working-directory: sephia
        run: npm run verify:staging
      - name: Verify actual Panitia host contract against built package
        working-directory: sephia
        run: npm run verify:host
      - name: Verify local Indonesian TTS adapter
        working-directory: sephia
        run: npm run verify:tts
      - name: Verify on-device Indonesian wake-word recognition
        working-directory: sephia
        run: npm run verify:wakeword
      - name: Verify Panitia avatar overlay and failure isolation
        working-directory: sephia
        run: npm run verify:avatar
      - name: Verify end-to-end notification speech pipeline
        working-directory: sephia
        run: npm run verify:pipeline
      - name: Verify isolated local voice diagnostics page
        working-directory: sephia
        run: npm run verify:diagnostics
      - name: Verify fixed local audio announcement adapter
        working-directory: sephia
        run: npm run verify:audio
      - name: Verify approved voice WAV asset (BLOCKED until supplied)
        working-directory: sephia
        run: npm run verify:voice-asset
      - name: Print release readiness audit (no deploy)
        working-directory: sephia
        run: npm run verify:release
      - name: Upload Stage 22 SEPHIA build and diagnostic fixtures
        uses: actions/upload-artifact@v4
        with:
          name: sephia-stage22-local-voice-diagnostics-${{ github.sha }}
          path: |
            sephia/dist/
            sephia/staging/voice-diagnostics.html
            sephia/staging/voice-diagnostics.js
            sephia/staging/panitia-host.html
            sephia/staging/panitia-host-fixture.js
            sephia/assets/README.md
            sephia/assets/avatar-sephia.svg
            sephia/docs/STAGE-22-RELEASE-READINESS.md
            sephia/assets/avatar-sephia.svg
          if-no-files-found: error
          retention-days: 14
