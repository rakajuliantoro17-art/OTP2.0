name: SEPHIA Tests

on:
  push:
    branches:
      - feature/sephia-module
    paths:
      - "sephia/**"
      - ".github/workflows/sephia-tests.yml"
  pull_request:
    paths:
      - "sephia/**"
      - ".github/workflows/sephia-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run SEPHIA unit tests
        working-directory: sephia
        run: npm test
