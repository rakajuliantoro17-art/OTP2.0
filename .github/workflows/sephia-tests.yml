name: SEPHIA Tests and Build

on:
  push:
    branches:
      - feature/sephia-module
    paths:
      - "sephia/**"
      - ".github/workflows/sephia-tests.yml"
  pull_request:
    paths:
      - "sephia/**"
      - ".github/workflows/sephia-tests.yml"

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run SEPHIA unit and integration tests
        working-directory: sephia
        run: npm test
      - name: Check security boundaries and local imports
        working-directory: sephia
        run: npm run check
      - name: Build browser ES module package
        working-directory: sephia
        run: npm run build
      - name: Verify staging fixture against built distribution
        working-directory: sephia
        run: npm run verify:staging
      - name: Verify actual Panitia host contract against built package
        working-directory: sephia
        run: npm run verify:host
      - name: Upload Stage 11 host integration build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sephia-stage12-local-indonesian-tts-${{ github.sha }}
          path: sephia/dist/
          if-no-files-found: error
          retention-days: 14
