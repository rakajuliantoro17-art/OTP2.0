name: SEPHIA Tests and Build

on:
  push:
    branches:
      - feature/sephia-module
      - main
    paths:
      - "sephia/**"
      - ".github/workflows/sephia-tests.yml"
  pull_request:
    paths:
      - "sephia/**"
      - ".github/workflows/sephia-tests.yml"

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt
      - name: Run SEPHIA unit and integration tests
        working-directory: sephia
        run: npm test
      - name: Check security boundaries and local imports
        working-directory: sephia
        run: npm run check
      - name: Build browser ES module package
        working-directory: sephia
        run: npm run build
      - name: Verify staging fixture against built distribution
        working-directory: sephia
        run: npm run verify:staging
      - name: Verify actual Panitia host contract against built package
        working-directory: sephia
        run: npm run verify:host
      - name: Verify local Indonesian TTS adapter
        working-directory: sephia
        run: npm run verify:tts
      - name: Verify Stage 27 offline neural runtime qualification
        working-directory: sephia
        run: npm run verify:runtime-prototype
      - name: Verify Stage 28 neural TTS acceptance benchmark
        working-directory: sephia
        run: npm run verify:acceptance
      - name: Verify Stage 29 secure local Chrome bridge decision
        working-directory: sephia
        run: npm run verify:stage29
      - name: Verify Stage 30 Chrome extension bridge
        working-directory: sephia
        run: npm run verify:stage30
      - name: Verify Stage 31 native host security gates
        working-directory: sephia
        run: npm run verify:stage31
      - name: Check Rust Native Messaging host formatting
        run: cargo fmt --manifest-path sephia/native-host/Cargo.toml -- --check
      - name: Verify Stage 32 in-memory inference integration
        working-directory: sephia
        run: npm run verify:stage32
      - name: Verify Stage 33 model and voice provisioning
        working-directory: sephia
        run: npm run verify:stage33
      - name: Verify Stage 34 target PC benchmark
        working-directory: sephia
        run: npm run verify:stage34
      - name: Verify Stage 35 native host process smoke test
        working-directory: sephia
        run: npm run verify:stage35
      - name: Verify Stage 37 Chrome audio activation
        working-directory: sephia
        run: npm run verify:stage37
      - name: Verify Stage 38 audio readiness diagnostics
        working-directory: sephia
        run: npm run verify:stage38
      - name: Verify Stage 39 spoken wake acknowledgement
        working-directory: sephia
        run: npm run verify:stage39
      - name: Verify Stage 40 native speech contract integrity
        working-directory: sephia
        run: npm run verify:stage40
      - name: Run Rust Native Messaging host unit tests
        run: cargo test --manifest-path sephia/native-host/Cargo.toml
      - name: Build and test local neural inference feature
        run: cargo test --manifest-path sephia/native-host/Cargo.toml --features inference
      - name: Pin generated native host dependency graph
        if: github.ref == 'refs/heads/feature/sephia-module'
        run: |
          if [ -f sephia/native-host/Cargo.lock ] && ! git ls-files --error-unmatch sephia/native-host/Cargo.lock >/dev/null 2>&1; then
            BASE_SHA="$(git rev-parse HEAD)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sephia/native-host/Cargo.lock
            git commit -m "chore(sephia): pin native host dependency graph"
            git fetch origin "${GITHUB_REF_NAME}"
            if [ "$BASE_SHA" != "$(git rev-parse "origin/${GITHUB_REF_NAME}")" ]; then
              echo "Feature branch advanced during CI; a newer run will pin Cargo.lock."
              exit 0
            fi
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verify on-device Indonesian wake-word recognition
        working-directory: sephia
        run: npm run verify:wakeword
      - name: Verify Panitia avatar overlay and failure isolation
        working-directory: sephia
        run: npm run verify:avatar
      - name: Verify end-to-end notification speech pipeline
        working-directory: sephia
        run: npm run verify:pipeline
      - name: Verify isolated local voice diagnostics page
        working-directory: sephia
        run: npm run verify:diagnostics
      - name: Verify fixed local audio announcement adapter
        working-directory: sephia
        run: npm run verify:audio
      - name: Verify legacy WAV asset remains unselected (compatibility gate only)
        working-directory: sephia
        run: npm run verify:voice-asset
      - name: Print release readiness audit (no deploy)
        working-directory: sephia
        run: npm run verify:release
      - name: Upload Stage 22 SEPHIA build and diagnostic fixtures
        uses: actions/upload-artifact@v4
        with:
          name: sephia-stage22-local-voice-diagnostics-${{ github.sha }}
          path: |
            sephia/dist/
            sephia/staging/voice-diagnostics.html
            sephia/staging/voice-diagnostics.js
            sephia/staging/panitia-host.html
            sephia/staging/panitia-host-fixture.js
            sephia/assets/README.md
            sephia/extension/
            sephia/native-host/Cargo.toml
            sephia/native-host/Cargo.lock
            sephia/native-host/src/
            sephia/native-host/*.ps1
            sephia/native-host/README.md
            sephia/native-host/THIRD-PARTY-NOTICES.md
            sephia/docs/STAGE-29-LOCAL-CHROME-BRIDGE-SECURITY.md
            sephia/docs/STAGE-30-CHROME-EXTENSION-BRIDGE.md
            sephia/docs/STAGE-31-NATIVE-MESSAGING-HOST.md
            sephia/docs/STAGE-32-IN-MEMORY-LARAS-INFERENCE.md
            sephia/docs/STAGE-33-MODEL-AND-VOICE-PROVISIONING.md
            sephia/docs/STAGE-34-TARGET-PC-BENCHMARK.md
            sephia/docs/STAGE-35-NATIVE-HOST-PROTOCOL-SMOKE-TEST.md
            sephia/docs/STAGE-36-PRODUCTION-CANDIDATE-RUNBOOK.md
            sephia/docs/STAGE-37-CHROME-AUDIO-ACTIVATION.md
            sephia/docs/STAGE-38-AUDIO-READINESS-DIAGNOSTICS.md
            sephia/docs/STAGE-39-WAKE-WORD-VOICE-ACKNOWLEDGEMENT.md
            sephia/docs/STAGE-40-NATIVE-CONTRACT-INTEGRITY.md
          if-no-files-found: error
          retention-days: 14

  build-native-host-windows:
    runs-on: windows-latest
    needs: verify-and-build
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.92.0
      - name: Validate Windows provisioning scripts
        shell: pwsh
        run: |
          $scripts = @(
            "sephia/native-host/provision-model-windows.ps1",
            "sephia/native-host/install-windows.ps1",
            "sephia/native-host/uninstall-windows.ps1",
            "sephia/native-host/benchmark-native-host-windows.ps1",
            "sephia/native-host/smoke-test-native-host-windows.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell syntax error in $script"
            }
          }
      - name: Build Windows native host with local inference feature
        run: cargo build --release --features inference --manifest-path sephia/native-host/Cargo.toml
      - name: Smoke test Windows Native Messaging host
        shell: pwsh
        run: .\sephia\native-host\smoke-test-native-host-windows.ps1 -HostExePath .\sephia\native-host\target\release\sephia-native-host.exe
      - name: Upload Windows native host build
        uses: actions/upload-artifact@v4
        with:
          name: sephia-native-host-windows-${{ github.sha }}
          path: |
            sephia/native-host/target/release/sephia-native-host.exe
            sephia/native-host/target/release/*.dll
            sephia/native-host/Cargo.lock
          if-no-files-found: error
          retention-days: 14
