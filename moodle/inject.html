<script>
(function () {
"use strict";

/* ================================================
   FILTER — hanya aktif di halaman quiz attempt
================================================ */
const pg = window.location.pathname;
if (!pg.includes("/mod/quiz/attempt.php") &&
    !pg.includes("/mod/quiz/review.php")) return;

/* ================================================
   CONFIG
================================================ */
const SECRET   = "SOOKO_HEBAT_2026";
const INTERVAL = 60;
const MAX_VIO  = 30;
const SPAM_MS  = 2000;
// Server monitor lokal (laptop panitia). Pastikan IP ini = IP laptop (lihat jendela start.bat)
const MONITOR  = "http://10.10.10.241:3000/api/report";

/* ================================================
   IDENTITAS SISWA
================================================ */
// ID siswa. Di Moodle `M.cfg.userid` (huruf kecil) umumnya TIDAK ada, sehingga semua siswa menjadi "guest" dan
// tercatat sebagai SATU orang di dashboard. Dicari dari beberapa sumber; terakhir dari nama; "guest" hanya jika semuanya gagal.
function readUid(name) {
    const q = s => document.querySelector(s);
    const idOf = h => { const m = /[?&]id=(\d+)/.exec(h || ""); return m ? m[1] : ""; };
    const tries = [
        () => window.M?.cfg?.userId,
        () => window.M?.cfg?.userid,
        () => document.body.dataset.userid,
        () => idOf(q(".logininfo a[href*='/user/']")?.getAttribute("href")),
        () => idOf(q(".usermenu a[href*='/user/profile.php'], .usermenu a[href*='/user/view.php']")?.getAttribute("href")),
        () => idOf(q("a[href*='/user/profile.php?id='][data-title='profile,moodle'], a[href*='/user/profile.php?id='][href*='course=']")?.getAttribute("href"))
    ];
    for (const f of tries) {
        let v = ""; try { v = String(f() || "").trim(); } catch (_) {}
        if (/^\d+$/.test(v) && v !== "0" && v !== "1") return v;   // 0 = tamu, 1 = guest bawaan Moodle
    }
    if (name && name !== "Siswa") return "n_" + name.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "").slice(0, 48);
    return "guest";
}
// Moodle 4.x: menu pengguna sering hanya berupa avatar (tanpa .usertext), jadi nama dicari dari beberapa tempat.
function readName() {
    const q = s => document.querySelector(s);
    const clean = t => String(t || "").replace(/\s+/g, " ").replace(/^(Picture of|Foto|Gambar)\s+/i, "").trim();
    const pic = () => q(".usermenu img, #user-menu-toggle img, .userbutton img");
    const tries = [
        () => q(".usermenu .usertext, .userbutton .usertext, #user-menu-toggle .usertext")?.textContent,
        () => q(".logininfo a[href*='/user/']")?.textContent,          // footer "Anda login sebagai <Nama>"
        () => pic()?.getAttribute("title"),
        () => pic()?.getAttribute("alt"),
        () => q("[data-region='usermenu'] .username, .usermenu .dropdown-menu .username")?.textContent,
        () => document.body.dataset.fullname
    ];
    for (const f of tries) {
        let v = ""; try { v = clean(f()); } catch (_) {}
        if (v && v.length < 80) return v;
    }
    return "Siswa";
}
let nama = readName();
const uid  = readUid(nama);
const uname = document.body.dataset.username  || uid;
// (2.9) Kelas siswa (mis. "XII 01") diambil dari akhiran nama di Moodle ("NAMA XII. 01", "NAMA X.12").
// Sebelumnya berisi ID course Moodle (21, 22, 23...), yaitu mata pelajaran, bukan kelas siswa.
function kelasOf(n) {
    const m = /(?:^|[\s(\[])(XII|XI|X)\s*[.\-\/]?\s*(\d{1,2})[)\]]?\s*$/i.exec(String(n || ""));
    return m ? m[1].toUpperCase() + " " + m[2].padStart(2, "0") : "-";
}
const examTitle = document.querySelector(".page-header-headings h1")?.innerText
               || document.title || "CBT";

document.getElementById("cN").innerText  = nama;
document.getElementById("cU").innerText  = uname;
document.getElementById("cEx").innerText = examTitle.substring(0, 30);

/* ================================================
   STATE
================================================ */
let vio     = Number(sessionStorage.getItem("cbt_v")  || 0);
let ulocks  = Number(sessionStorage.getItem("cbt_ul") || 0);
let locked  = sessionStorage.getItem("cbt_lk") === "1";
let lastEvt = 0;
let lastW   = window.innerWidth;
let lastH   = window.innerHeight;
let lastLand = window.innerWidth > window.innerHeight;

const overlay = document.getElementById("cbtOverlay");
const inp     = document.getElementById("cbtInput");
const btn     = document.getElementById("cbtBtn");

/* ================================================
   ANTI COPY / SELECT — mobile & desktop
================================================ */
document.getElementById("cbtAntiSelect").textContent = `
    body, * {
        -webkit-user-select: none !important;
        -moz-user-select: none !important;
        user-select: none !important;
        -webkit-touch-callout: none !important;
    }
    input, textarea, [contenteditable] {
        -webkit-user-select: text !important;
        user-select: text !important;
    }
`;

// Blokir context menu (long press mobile)
document.addEventListener("contextmenu", e => {
    e.preventDefault();
    lock("right_click");
});

// Blokir copy semua cara
document.addEventListener("copy",       e => { e.preventDefault(); lock("copy_action"); });
document.addEventListener("cut",        e => { e.preventDefault(); lock("copy_action"); });
document.addEventListener("selectstart",e => {
    // Izinkan select di dalam input/textarea
    if (!["INPUT","TEXTAREA"].includes(e.target.tagName)) e.preventDefault();
});

// Blokir share mobile (Web Share API abuse)
document.addEventListener("touchstart", e => {
    if (e.touches.length > 2) { e.preventDefault(); lock("suspicious_pattern"); }
}, { passive: false });

/* ================================================
   LAPOR KE SERVER LOKAL (gagal = diam, kunci tetap jalan)
   text/plain agar tidak memicu preflight CORS.
   Server menjaga hitungan pelanggaran tidak pernah turun.
================================================ */
// Progres pengerjaan: soal terjawab / total, dibaca dari blok navigasi kuis Moodle (hanya di halaman attempt).
function readProgress() {
    try {
        if (!window.location.pathname.includes("/mod/quiz/attempt.php")) return "";
        const all = document.querySelectorAll("#mod_quiz_navblock .qnbutton, .qn_buttons .qnbutton");
        if (!all.length) return "";
        let done = 0;
        all.forEach(b => { if (!b.classList.contains("notyetanswered") && !b.classList.contains("invalidanswer")) done++; });
        return done + "/" + all.length;
    } catch (_) { return ""; }
}

function report(event) {
    if (nama === "Siswa") {   // coba lagi bila elemen nama baru muncul setelah script dimuat
        const n = readName();
        if (n !== "Siswa") { nama = n; const c = document.getElementById("cN"); if (c) c.innerText = n; }
    }
    try {
        fetch(MONITOR, {
            method: "POST", keepalive: true,
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({ uid, nama, username: uname, kelas: kelasOf(nama), exam: examTitle.substring(0, 40),
                                   violation: vio, unlocks: ulocks, event, progress: readProgress() })
        }).then(r => r.json()).then(d => {
            // (2.8) Hitungan server lebih tinggi (mis. dari tab/perangkat lain milik siswa yang sama) diikuti di sini.
            if (d && d.ok && uid !== "guest" && Number(d.violation) > vio) {
                vio = Number(d.violation); sessionStorage.setItem("cbt_v", vio); ui();
            }
        }).catch(() => {});
    } catch (_) {}
}
setInterval(() => report("heartbeat"), 15000);

/* ================================================
   UI UPDATE
================================================ */
function ui() {
    document.getElementById("cV").innerText  = vio;
    document.getElementById("cUl").innerText = ulocks;
    let cls = "bs", lbl = "AMAN";
    if      (vio >= MAX_VIO) { cls = "bl"; lbl = "DIKUNCI"; }
    else if (vio >= 26)      { cls = "bc"; lbl = "KRITIS";  }
    else if (vio >= 11)      { cls = "bw"; lbl = "WASPADA"; }
    document.getElementById("cSt").innerHTML = `<span class="cbadge ${cls}">${lbl}</span>`;
    if (vio >= MAX_VIO) {
        inp.disabled  = true;
        btn.disabled  = true;
        btn.innerText = "🔴 TERKUNCI PERMANEN";
        document.getElementById("cbtHint").innerText =
            "Terlalu banyak pelanggaran. Hubungi pengawas ruangan.";
    }
}

/* ================================================
   TOTP ENGINE
================================================ */
function totpHash(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) { h = (h << 5) - h + s.charCodeAt(i); h |= 0; }
    return Math.abs(h);
}
function getOTP(back = 0) {
    const t = Math.floor(Date.now() / 1000 / INTERVAL) - back;
    return (totpHash(t + SECRET) % 1000000).toString().padStart(6, "0");
}

// Master OTP — identik dengan panitia/js/otp.js (generateMasterOTP)
function getMasterOTP(back = 0) {
    const t = Math.floor(Date.now() / 1000 / INTERVAL) - back;
    return (totpHash(t + SECRET + "_MASTER") % 1000000).toString().padStart(6, "0");
}
// (2.5) Toleransi: kode dari jendela 60 dtk sebelumnya masih diterima, agar kode yang baru dibacakan
// panitia tidak kedaluwarsa di tengah pengetikan (satu salah = +1 pelanggaran, 30 = terkunci permanen).
const isOTP       = c => c === getOTP(0)       || c === getOTP(1);
const isMasterOTP = c => c === getMasterOTP(0) || c === getMasterOTP(1);

/* ================================================
   TOAST
================================================ */
function toast(msg, color = "#ff3b30") {
    const el = document.getElementById("cbtToast");
    el.innerText = msg; el.style.background = color + "cc";
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove("show"), 2500);
}

/* ================================================
   LOCK
================================================ */
/* Ganti soal = pindah halaman (reload). Saat itu browser bisa memicu fullscreen_exit / blur / tab_switch
   yang BUKAN pelanggaran. Dua penanda jendela singkat (hanya 3 jenis alasan ini):
   - halaman lama: ditandai saat benar-benar ditutup (pagehide), atau beforeunload yang tidak jadi pindah dibatalkan 1,5 dtk;
   - halaman baru: 2,5 dtk pertama setelah dimuat bila penanda halaman lama masih baru.
   Rotasi layar membuka jendela singkat (rotUntil) HANYA untuk fullscreen_exit.
   Pelanggaran lain (shortcut, split screen, copy, klik kanan, wrong_otp) tidak terpengaruh. */
const NAV_REASONS = ["fullscreen_exit", "tab_switch", "window_blur"];
const NAV_GRACE_MS = 3000;
let navUntil = 0;
let rotUntil = 0;
try {
    const m = Number(sessionStorage.getItem("cbt_nav") || 0);
    if (m && Date.now() - m < 10000) navUntil = Date.now() + 2500;
} catch (_) {}
function markNav() { try { sessionStorage.setItem("cbt_nav", String(Date.now())); } catch (_) {} }
window.addEventListener("beforeunload", () => {
    markNav();
    setTimeout(() => { try { sessionStorage.removeItem("cbt_nav"); } catch (_) {} }, 1500);
});
window.addEventListener("pagehide", markNav);
function inNavGrace(reason) {
    if (!NAV_REASONS.includes(reason)) return false;
    if (reason === "fullscreen_exit" && Date.now() < rotUntil) return true;
    if (Date.now() < navUntil) return true;
    let m = 0; try { m = Number(sessionStorage.getItem("cbt_nav") || 0); } catch (_) {}
    return m > 0 && Date.now() - m < NAV_GRACE_MS;
}

function lock(reason) {
    const now = Date.now();
    if (inNavGrace(reason)) return;
    if (now - lastEvt < SPAM_MS) return;
    if (locked) return;
    lastEvt = now;

    vio++;
    sessionStorage.setItem("cbt_v",  vio);
    sessionStorage.setItem("cbt_lk", "1");
    locked = true;

    overlay.style.display = "flex";
    ui();
    toast("⚠ " + reason.replace(/_/g, " ").toUpperCase());
    report(reason);

    if (navigator.vibrate) navigator.vibrate([200, 80, 200]);
    try {
        document.body.animate(
            [{ filter:"brightness(1)" },{ filter:"brightness(1.5)" },{ filter:"brightness(1)" }],
            { duration: 350 }
        );
    } catch(_) {}
}

/* ================================================
   UNLOCK
================================================ */
btn.onclick = function () {
    const input = inp.value.trim().replace(/\s/g, "");
    if (!input) return;

    // Pelanggaran >= 26: hanya Master OTP (dari panitia) yang diterima.
    // OTP biasa ditolak tanpa menambah pelanggaran.
    const needMaster = vio >= 26;
    if (needMaster && isOTP(input)) {
        toast("🔒 Pelanggaran ≥ 26 — minta MASTER OTP ke panitia");
        inp.value = "";
        return;
    }

    // (2.9) Master OTP diketik saat pelanggaran < 26: bukan kode salah. Ditolak tanpa menambah pelanggaran.
    if (!needMaster && isMasterOTP(input) && !isOTP(input)) {
        toast("🔒 Master OTP hanya untuk pelanggaran ≥ 26 — gunakan OTP biasa");
        inp.value = "";
        return;
    }

    if (needMaster ? isMasterOTP(input) : isOTP(input)) {
        overlay.style.display = "none";
        sessionStorage.removeItem("cbt_lk");
        locked = false; inp.value = ""; ulocks++;
        sessionStorage.setItem("cbt_ul", ulocks);
        // baseline ukuran layar disamakan dengan kondisi saat ini (mis. setelah rotasi)
        lastW = window.innerWidth; lastH = window.innerHeight; lastLand = lastW > lastH;
        ui(); report("unlock"); toast("✅ Akses dibuka kembali", "#34c759");
    } else {
        // Kode salah: dihitung langsung (lock() tidak bisa dipakai karena sudah terkunci)
        toast("❌ Kode salah — pelanggaran dicatat");
        try {
            inp.animate(
                [{transform:"translateX(-6px)"},{transform:"translateX(6px)"},
                 {transform:"translateX(-6px)"},{transform:"translateX(0)"}],
                { duration: 280 }
            );
        } catch(_) {}
        inp.value = "";
        const now = Date.now();
        if (now - lastEvt >= SPAM_MS && vio < MAX_VIO) {
            lastEvt = now;
            vio++;
            sessionStorage.setItem("cbt_v", vio);
            ui(); report("wrong_otp");
        }
    }
};
inp.addEventListener("keydown", e => { if (e.key === "Enter") btn.click(); });

/* ================================================
   RESTORE STATE
================================================ */
ui();
if (locked) setTimeout(() => overlay.style.display = "flex", 350);

/* ================================================
   SINKRON DARI SERVER (2.6) — hanya untuk TAB BARU
   sessionStorage hilang pada tab baru, sehingga hitungan & kunci bisa lolos. Tab baru bertanya ke jembatan:
   hitungan dinaikkan ke angka server, dan bila server mencatat siswa sedang terkunci, langsung terkunci.
   Tab yang sudah berjalan (ganti soal) TIDAK ditimpa, jadi laporan unlock yang hilang tidak mengunci ulang.
   Jembatan tidak terjangkau = dilewati (gagal terbuka).
================================================ */
async function syncFromServer() {
    let fresh = false;
    try { fresh = sessionStorage.getItem("cbt_init") === null; sessionStorage.setItem("cbt_init", "1"); } catch (_) { return; }
    if (!fresh || uid === "guest") return;
    try {
        const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 3000);
        const r = await fetch(MONITOR.replace("/api/report", "/api/me") + "?uid=" + encodeURIComponent(uid), { cache: "no-store", signal: ctl.signal });
        clearTimeout(to);
        const d = await r.json();
        if (!d || !d.ok) return;
        const sv = Number(d.violation) || 0, su = Number(d.unlocks) || 0;
        if (sv > vio)    { vio = sv;    sessionStorage.setItem("cbt_v",  vio); }
        if (su > ulocks) { ulocks = su; sessionStorage.setItem("cbt_ul", ulocks); }
        if (d.locked && !locked) {
            locked = true; sessionStorage.setItem("cbt_lk", "1");
            overlay.style.display = "flex";
        }
        ui();
    } catch (_) {}
}
syncFromServer();

/* ================================================
   WATCHDOG OVERLAY
   Selama status terkunci, overlay harus tetap ada & tampil
   (dipulihkan bila disembunyikan / dihapus / diubah gayanya).
================================================ */
function guardOverlay() {
    if (!locked) return;
    if (!document.body.contains(overlay)) document.body.appendChild(overlay);
    if (overlay.style.display !== "flex") overlay.style.display = "flex";
    if (overlay.style.visibility || overlay.style.opacity || overlay.style.pointerEvents) {
        overlay.style.visibility = ""; overlay.style.opacity = ""; overlay.style.pointerEvents = "";
    }
}
setInterval(guardOverlay, 500);
try {
    new MutationObserver(guardOverlay).observe(overlay, { attributes: true, attributeFilter: ["style", "class", "hidden"] });
} catch (_) {}

/* ================================================
   DETEKSI PELANGGARAN — DESKTOP
================================================ */
document.addEventListener("keydown", e => {
    const blk =
        e.key === "F12" ||
        (e.ctrlKey && ["u","s","p","i","a","c","x"].includes(e.key.toLowerCase())) ||
        (e.ctrlKey && e.shiftKey && ["i","j","c"].includes(e.key.toLowerCase()));
    if (blk) { e.preventDefault(); lock("keyboard_shortcut"); }
});

// Minimize / ganti app / swipe notif bar (turunkan notif = blur + visibility hidden)
document.addEventListener("visibilitychange", () => {
    if (document.hidden) {

// Rotasi layar (potret <-> landscape): bukan pelanggaran. Reset baseline ukuran.
function onRotate() {
    rotUntil = Date.now() + 800;
    setTimeout(() => { lastW = window.innerWidth; lastH = window.innerHeight; lastLand = lastW > lastH; }, 600);
}
window.addEventListener("orientationchange", onRotate);
try { if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener("change", onRotate); } catch (_) {}

// Split screen & dual window — deteksi via resize
// Saat split screen: lebar window mengecil drastis (> 25%) atau tinggi (> 40%)
window.addEventListener("resize", () => {
    const newW = window.innerWidth;
    const newH = window.innerHeight;
    const land = newW > newH;

    // Rotasi asli = orientasi berubah DAN ukuran bertukar (lebar baru ≈ tinggi lama, tinggi baru ≈ lebar lama).
    // Pengecekan "bertukar" mencegah split screen yang kebetulan mengubah rasio dianggap rotasi.
    const swapped = Math.abs(newW - lastH) < lastH * 0.3 && Math.abs(newH - lastW) < lastW * 0.3;
    const areaClose = Math.abs(newW * newH - lastW * lastH) < lastW * lastH * 0.3;   // rotasi tidak mengubah luas; split screen mengubah
    const rotLike = land !== lastLand && (swapped || (Date.now() < rotUntil && areaClose));
    if (rotLike) {
        lastW = newW; lastH = newH; lastLand = land;
        return;
    }

    const shrinkW = newW < lastW * 0.75; // lebar berkurang > 25%
    const shrinkH = newH < lastH * 0.60; // tinggi berkurang > 40% (notif bar besar)

    if (shrinkW) {
        lock("split_screen");
    } else if (shrinkH) {
        lock("suspicious_pattern");
    }

    // Update referensi ukuran saat tidak locked
    if (!locked) { lastW = newW; lastH = newH; lastLand = land; }
});

// Screenshot — visibilitychange singkat di beberapa Android
// Tidak 100% reliable tapi tetap dicatat
document.addEventListener("visibilitychange", () => {
    if (document.hidden) return; // sudah dihandle di atas
    // Tidak dikunci karena false positive tinggi, hanya log
    console.warn("[CBT] Possible screenshot detected");
});

// Fullscreen exit
document.addEventListener("fullscreenchange", () => {

/* ================================================
   KAMERA FLOATING
================================================ */
let camStream = null, useFront = true;
const vid   = document.getElementById("cbtVideo");
const camSt = document.getElementById("cbtCamSt");

function setCamSt(t, c="#fff") {
    camSt.innerHTML = t; camSt.style.color = c;
    const box = document.getElementById("cbtCam");   // indikator pada titik kecil: warna bingkai + tooltip
    if (box) { box.style.borderColor = c; box.title = "Kamera: " + String(t).replace(/<[^>]*>/g, ""); }
}

async function startCam() {
    setCamSt("🟡 Meminta izin...");
    try {
        if (camStream) camStream.getTracks().forEach(t => t.stop());
        try {
            camStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: useFront ? "user" : "environment" }, audio: false
            });
        } catch {
            camStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        }
        vid.srcObject = camStream;
        setCamSt("🟢 Aktif", "#39FF14");
        camStream.getVideoTracks()[0].onended = () => setCamSt("🔴 Terputus", "#ff4444");
    } catch(e) {
        setCamSt("⚠ " + (e.name === "NotAllowedError" ? "Izin Ditolak" : "Gagal"), "#FFD700");
    }
}

document.getElementById("cbtBtnCam").onclick = startCam;
document.getElementById("cbtBtnSw").onclick  = () => { useFront = !useFront; startCam(); };
if (navigator.mediaDevices?.getUserMedia) startCam();
else setCamSt("❌ Tidak Didukung", "#ff4444");

/* ================================================
   DRAG KAMERA
================================================ */
const camBox = document.getElementById("cbtCam");
let dr = false, ox = 0, oy = 0;
const startDrag = e => {
    dr = true;
    const pt = e.touches?.[0] || e;
    const r  = camBox.getBoundingClientRect();
    ox = pt.clientX - r.left; oy = pt.clientY - r.top;
};
const doDrag = e => {
    if (!dr) return;
    const pt = e.touches?.[0] || e;
    camBox.style.left = (pt.clientX-ox)+"px"; camBox.style.top = (pt.clientY-oy)+"px";
    camBox.style.right = "auto"; camBox.style.bottom = "auto";
};
camBox.addEventListener("mousedown",  startDrag);
camBox.addEventListener("touchstart", startDrag, { passive: true });
document.addEventListener("mousemove", doDrag);
document.addEventListener("touchmove", doDrag, { passive: true });
document.addEventListener("mouseup",   () => dr = false);
document.addEventListener("touchend",  () => dr = false);

})();
</script>
