<script>
(function () {
"use strict";

/* ================================================
   FILTER — hanya aktif di halaman quiz attempt
================================================ */
const pg = window.location.pathname;
if (!pg.includes("/mod/quiz/attempt.php") &&
    !pg.includes("/mod/quiz/review.php")) return;

/* ================================================
   CONFIG — harus identik dengan pengawas/js/unlock.js
================================================ */
const SECRET    = "SOOKO_HEBAT_2026";
const INTERVAL  = 60;     // detik per siklus OTP
const MAX_VIO   = 30;     // threshold auto-lock permanen
const SPAM_MS   = 2000;   // debounce antar violation

// Server monitor lokal (laptop panitia). GANTI IP sesuai hasil `node server.js`
const MONITOR = "http://10.10.10.XXX:3000/api/report";

/* ================================================
   IDENTITAS SISWA dari Moodle
================================================ */
const uid   = String(window.M?.cfg?.userid   || document.body.dataset.userid   || "guest");
const nama  = document.body.dataset.fullname  || "Siswa";
const uname = document.body.dataset.username  || uid;
const kelas = String(window.M?.cfg?.courseId  || document.body.dataset.courseid || "0");

// Nama ujian dari judul halaman
const examTitle = document.querySelector(".page-header-headings h1")?.innerText
               || document.title.replace(" - " + document.querySelector(".site-name")?.innerText, "")
               || "CBT";

// Isi info panel
document.getElementById("cN").innerText  = nama;
document.getElementById("cU").innerText  = uname;
document.getElementById("cEx").innerText = examTitle.substring(0, 30);

/* ================================================
   STATE — pakai sessionStorage agar tidak hilang
   saat Moodle autosave reload halaman
================================================ */
let vio    = Number(sessionStorage.getItem("cbt_v")  || 0);
let ulocks = Number(sessionStorage.getItem("cbt_ul") || 0);
let locked = sessionStorage.getItem("cbt_lk") === "1";
let lastEvt = 0;

/* ================================================
   LAPOR KE SERVER LOKAL (gagal = diam, kunci tetap jalan)
================================================ */
function report(event) {
    try {
        fetch(MONITOR, {
            method: "POST", keepalive: true,
            headers: { "Content-Type": "text/plain" },   // tanpa preflight CORS
            body: JSON.stringify({ uid, nama, username: uname, kelas, exam: examTitle.substring(0, 40),
                                   violation: vio, unlocks: ulocks, event })
        }).catch(() => {});
    } catch (_) {}
}

const overlay = document.getElementById("cbtOverlay");
const inp     = document.getElementById("cbtInput");
const btn     = document.getElementById("cbtBtn");

/* ================================================
   UI UPDATE
================================================ */
function ui() {
    document.getElementById("cV").innerText  = vio;
    document.getElementById("cUl").innerText = ulocks;

    let cls = "bs", lbl = "AMAN";
    if      (vio >= MAX_VIO) { cls = "bl"; lbl = "DIKUNCI"; }
    else if (vio >= 26)      { cls = "bc"; lbl = "KRITIS";  }
    else if (vio >= 11)      { cls = "bw"; lbl = "WASPADA"; }

    document.getElementById("cSt").innerHTML =
        `<span class="cbadge ${cls}">${lbl}</span>`;

    if (vio >= MAX_VIO) {
        inp.disabled  = true;
        btn.disabled  = true;
        btn.innerText = "🔴 TERKUNCI PERMANEN";
        document.getElementById("cbtHint").innerText =
            "Terlalu banyak pelanggaran. Hubungi pengawas ruangan.";
    }
}

/* ================================================
   TOTP ENGINE
   Identik dengan pengawas/js/unlock.js
================================================ */
function totpHash(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) {
        h = (h << 5) - h + s.charCodeAt(i);
        h |= 0;
    }
    return Math.abs(h);
}

function getOTP() {
    const t = Math.floor(Date.now() / 1000 / INTERVAL);
    return (totpHash(t + SECRET) % 1000000).toString().padStart(6, "0");
}

/* ================================================
   TOAST NOTIFICATION
================================================ */
function toast(msg, color = "#ff3b30") {
    const el = document.getElementById("cbtToast");
    el.innerText         = msg;
    el.style.background  = color + "cc";
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove("show"), 2500);
}

/* ================================================
   LOCK
================================================ */
function lock(reason) {
    const now = Date.now();
    if (now - lastEvt < SPAM_MS) return;
    if (locked) return;
    lastEvt = now;

    vio++;
    sessionStorage.setItem("cbt_v",  vio);
    sessionStorage.setItem("cbt_lk", "1");
    locked = true;

    overlay.style.display = "flex";
    ui();
    toast("⚠ " + reason.replace(/_/g, " ").toUpperCase());

    if (navigator.vibrate) navigator.vibrate([200, 80, 200]);

    try {
        document.body.animate(
            [{ filter: "brightness(1)" }, { filter: "brightness(1.5)" }, { filter: "brightness(1)" }],
            { duration: 350 }
        );
    } catch(_) {}

    report(reason);
    console.warn("[CBT LOCK]", reason, "| violation:", vio);
}

/* ================================================
   UNLOCK
================================================ */
btn.onclick = function () {
    const input = inp.value.trim().replace(/\s/g, "");
    if (!input) return;

    if (input === getOTP()) {
        // OTP benar
        overlay.style.display = "none";
        sessionStorage.removeItem("cbt_lk");
        locked    = false;
        inp.value = "";
        ulocks++;
        sessionStorage.setItem("cbt_ul", ulocks);
        ui();
        report("unlock");
        toast("✅ Akses dibuka kembali", "#34c759");
    } else {
        // OTP salah
        toast("❌ Kode salah — pelanggaran dicatat");
        try {
            inp.animate(
                [{ transform: "translateX(-6px)" }, { transform: "translateX(6px)" },
                 { transform: "translateX(-6px)" }, { transform: "translateX(0)" }],
                { duration: 280 }
            );
        } catch(_) {}
        lock("wrong_otp");
    }
};

/* ================================================
   ENTER KEY di input
================================================ */
inp.addEventListener("keydown", e => { if (e.key === "Enter") btn.click(); });

/* ================================================
   RESTORE STATE saat Moodle autosave reload
================================================ */
ui();
if (locked) setTimeout(() => overlay.style.display = "flex", 350);

/* ================================================
   DETEKSI PELANGGARAN
================================================ */

// Tab switch
document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        setTimeout(() => { if (document.hidden) lock("tab_switch"); }, 800);
    }
});

// Window blur (ALT+TAB tanpa buka tab baru)
window.addEventListener("blur", () => {
    setTimeout(() => { if (!document.hidden) lock("window_blur"); }, 800);
});

// Keyboard shortcut berbahaya
document.addEventListener("keydown", e => {
    const blk =
        e.key === "F12" ||
        (e.ctrlKey && ["u","s","p","i","a"].includes(e.key.toLowerCase())) ||
        (e.ctrlKey && e.shiftKey && ["i","j","c"].includes(e.key.toLowerCase()));
    if (blk) { e.preventDefault(); lock("keyboard_shortcut"); }
});

// Copy & klik kanan
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("copy",        e => e.preventDefault());

// Fullscreen exit
document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement) lock("fullscreen_exit");
});

/* ================================================
   KAMERA FLOATING
================================================ */
let camStream = null;
let useFront  = true;

const vid    = document.getElementById("cbtVideo");
const camSt  = document.getElementById("cbtCamSt");

function setCamSt(t, c = "#fff") { camSt.innerHTML = t; camSt.style.color = c; }

async function stopCam() {
    if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
}

async function startCam() {
    setCamSt("🟡 Meminta izin...");
    try {
        await stopCam();
        try {
            camStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: useFront ? "user" : "environment" }, audio: false
            });
        } catch {
            camStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        }
        vid.srcObject = camStream;
        setCamSt("🟢 Aktif", "#39FF14");
        camStream.getVideoTracks()[0].onended = () => setCamSt("🔴 Terputus", "#ff4444");
    } catch (e) {
        const msg = e.name === "NotAllowedError" ? "Izin Ditolak" : "Gagal";
        setCamSt("⚠ " + msg, "#FFD700");
    }
}

document.getElementById("cbtBtnCam").onclick = startCam;
document.getElementById("cbtBtnSw").onclick  = async () => { useFront = !useFront; await startCam(); };

if (navigator.mediaDevices?.getUserMedia) startCam();
else setCamSt("❌ Tidak Didukung", "#ff4444");

/* ================================================
   DRAG KAMERA
================================================ */
const camBox = document.getElementById("cbtCam");
let dr = false, ox = 0, oy = 0;

function startDrag(e) {
    dr = true;
    const pt = e.touches ? e.touches[0] : e;
    const r  = camBox.getBoundingClientRect();
    ox = pt.clientX - r.left;
    oy = pt.clientY - r.top;
}

function doDrag(e) {
    if (!dr) return;
    const pt = e.touches ? e.touches[0] : e;
    camBox.style.left   = (pt.clientX - ox) + "px";
    camBox.style.top    = (pt.clientY - oy) + "px";
    camBox.style.right  = "auto";
    camBox.style.bottom = "auto";
}

camBox.addEventListener("mousedown",  startDrag);
camBox.addEventListener("touchstart", startDrag, { passive: true });
document.addEventListener("mousemove",  doDrag);
document.addEventListener("touchmove",  doDrag, { passive: true });
document.addEventListener("mouseup",    () => dr = false);
document.addEventListener("touchend",   () => dr = false);


report("heartbeat");
setInterval(() => report("heartbeat"), 15000);
})();
</script>
