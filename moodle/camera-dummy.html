<!-- SMANSASOO CBT — UJI KAMERA (DUMMY)
     Menyalakan kamera sebagai pratinjau kecil 25x25 px di pojok kanan bawah.
     TIDAK merekam, TIDAK mengambil gambar, TIDAK mengirim apa pun ke jaringan, TIDAK menyimpan.
     Bingkai merah + tulisan pada tooltip menandakan kamera aktif (tidak disembunyikan).
     Tempel di Moodle > Additional HTML > "Before BODY is closed", terpisah dari inject.html. -->
<script>
(function () {
  "use strict";
  if (window.__cbtCamDummy) return;
  window.__cbtCamDummy = true;

  var SIZE = 25;
  var box = document.createElement("div");
  box.id = "cbtCamDummy";
  box.title = "Kamera aktif (uji coba). Gambar tidak direkam, tidak disimpan, dan tidak dikirim ke mana pun.";
  box.style.cssText = "position:fixed;right:8px;bottom:8px;width:" + SIZE + "px;height:" + SIZE +
    "px;z-index:2147483000;border:2px solid #e03131;border-radius:50%;overflow:hidden;background:#222;" +
    "box-shadow:0 0 0 1px #fff;pointer-events:none;box-sizing:border-box;";

  var video = document.createElement("video");
  video.muted = true;               // tanpa audio
  video.playsInline = true;
  video.autoplay = true;
  video.setAttribute("aria-label", "Pratinjau kamera uji coba");
  video.style.cssText = "width:100%;height:100%;object-fit:cover;transform:scaleX(-1);";
  box.appendChild(video);

  function fail(reason) {
    box.style.borderColor = "#868e96";
    box.title = "Kamera tidak aktif: " + reason;
    try { console.warn("[CAM-DUMMY] " + reason); } catch (e) {}
  }

  function start() {
    document.body.appendChild(box);
    if (!window.isSecureContext) return fail("halaman bukan HTTPS/localhost (diblokir Chrome)");
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return fail("browser tidak mendukung kamera");
    navigator.mediaDevices.getUserMedia({ video: { width: 160, height: 120, facingMode: "user" }, audio: false })
      .then(function (stream) {
        video.srcObject = stream;
        window.addEventListener("pagehide", function () {
          stream.getTracks().forEach(function (t) { t.stop(); });
        });
      })
      .catch(function (err) { fail(err && err.name ? err.name : "ditolak"); });
  }

  if (document.body) start(); else document.addEventListener("DOMContentLoaded", start);
})();
</script>
